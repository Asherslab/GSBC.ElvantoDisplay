[env:esp32-8048s070]
# pioarduino: Arduino core 3.3.12 / ESP-IDF 5.5.5 (needed for esp_lcd RGB bounce-buffer mode)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
  ; Release version, set by CI (FW_VERSION=1.0.3); empty for local builds
  '-DFW_VERSION="${sysenv.FW_VERSION}"'
monitor_speed = 115200
upload_speed = 460800
lib_deps =
  lovyan03/LovyanGFX@1.2.33
  bblanchon/ArduinoJson@7.2.1
